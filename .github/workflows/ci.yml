# test / typecheck / build / lint を PR と main への push で走らせる（#68）。
#
# react のテストも止める側に置く。手元で 70 件落ちる #52（React.act is not a function）は
# シェルの NODE_ENV=production が原因で、React の production ビルドに act が無いだけ。
# CI（NODE_ENV 未設定）では 128 件すべて通る。手元では `NODE_ENV=test pnpm test` で回す。
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 22: @synapse-chat/mcp/skills は node:sqlite（Node 22.13+）を使う（#73）
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint

      - run: pnpm test

      # 版上げは PR の中で済ませる（`pnpm changeset` → `pnpm changeset version`）。
      # 未適用の changeset を main に入れると、release.yml が何も publish できずに落ちる。
      - name: Changesets are applied
        if: github.event_name == 'pull_request'
        run: |
          pending=$(find .changeset -name '*.md' ! -name README.md)
          if [ -n "$pending" ]; then
            echo "::error::未適用の changeset があります。PR の中で \`pnpm changeset version\` を実行して版を上げてください:"
            echo "$pending"
            exit 1
          fi
